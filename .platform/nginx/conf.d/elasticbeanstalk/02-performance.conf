# Speed: compress text responses (pages, CSS, JavaScript, JSON, SVG) on the fly, and let browsers keep the built
# assets. Vite names every file under /build by its content hash, so a changed file always gets a new name and these
# can be cached for a year. Images under /images change rarely: a week. (Server context, so nothing here repeats a
# setting in the platform's own http block.)
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types text/plain text/css text/xml application/javascript application/json application/xml application/manifest+json image/svg+xml;

location /build/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

location /images/ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
}
