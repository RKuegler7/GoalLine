<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#176b45">
    <title>Offline · GoalLine</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            background: #fafaf5;
            color: #1e2922;
        }
        header {
            background: #176b45;
            padding: calc(env(safe-area-inset-top) + 48px) 24px 48px;
            border-bottom: 4px solid #fafaf5;
            box-shadow: 0 4px 0 #43b96a;
            text-align: center;
        }
        header img { width: 72px; height: 72px; border-radius: 18px; }
        main { flex: 1; max-width: 28rem; margin: 0 auto; padding: 40px 24px; text-align: center; }
        h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 500; font-size: 1.9rem; color: #176b45; margin: 0; }
        p { color: rgba(30, 41, 34, 0.75); line-height: 1.55; }
        button {
            margin-top: 12px;
            border: 0;
            border-radius: 999px;
            background: #176b45;
            color: #fafaf5;
            font: inherit;
            font-weight: 600;
            padding: 12px 28px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header>
        <img src="/icons/app-icon.svg" alt="GoalLine">
    </header>
    <main>
        <h1>You&rsquo;re offline</h1>
        <p>GoalLine needs a connection to save your check-ins. Your streak is safe. Reconnect and pick up right where you left off.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
        window.addEventListener('online', () => location.reload());
    </script>
</body>
</html>
